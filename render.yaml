services:
  - type: web
    name: ai-career-navigator-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: http://localhost:5173,https://your-frontend.vercel.app
      - key: FRONTEND_URL
        value: https://your-frontend.vercel.app
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
